<!doctype html>
<html lang="es-DO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />

    <!--
      El titulo empieza por lo que la gente escribe en Google ("camaras de
      seguridad", "redes", "soporte tecnico") y no por el nombre de la empresa:
      nadie que aun no te conoce busca "RTS Technology".
      Google recorta alrededor de los 60 caracteres, asi que lo importante va
      delante.
    -->
    <title>Cámaras de Seguridad, Redes y Soporte Técnico | RTS Technology Solutions</title>
    <meta
      name="description"
      content="Instalación de cámaras de seguridad, CCTV, redes WiFi, cableado estructurado y soporte técnico para empresas en Santo Domingo y toda República Dominicana. Cotización sin costo y respuesta en menos de 4 horas hábiles."
    />
    <meta name="author" content="RTS Technology Solutions" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- TODO: cambiar por rtstechnology.do cuando conectes el dominio propio en Cloudflare -->
    <link rel="canonical" href="https://rts-technology.pages.dev/" />

    <!-- Vista previa al compartir (WhatsApp, LinkedIn, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RTS Technology Solutions" />
    <meta property="og:locale" content="es_DO" />
    <meta property="og:url" content="https://rts-technology.pages.dev/" />
    <meta property="og:title" content="Cámaras de Seguridad, Redes y Soporte Técnico | RTS Technology" />
    <meta
      property="og:description"
      content="Instalación de cámaras de seguridad, redes WiFi, cableado estructurado y soporte técnico para empresas dominicanas. Cotización sin costo."
    />
    <meta property="og:image" content="https://rts-technology.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RTS Technology Solutions — Soluciones tecnológicas empresariales" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cámaras de Seguridad, Redes y Soporte Técnico | RTS Technology" />
    <meta
      name="twitter:description"
      content="Instalación de cámaras de seguridad, redes WiFi, cableado estructurado y soporte técnico para empresas dominicanas."
    />
    <meta name="twitter:image" content="https://rts-technology.pages.dev/og-image.png" />

    <!--
      Iconos generados desde el logo real (src/assets/rts-logo.png).
      Antes se servia public/favicon.svg, que era el logo morado de Vite: la
      pestana del navegador mostraba la marca de Vite en lugar de la de RTS.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Las fuentes se cargaban con @import dentro del CSS, lo que encadena
      peticiones (HTML -> CSS -> CSS de Google -> ficheros) y retrasa el primer
      pintado. `preconnect` abre la conexion TLS en paralelo al HTML.

      Antes se usaba el truco `media="print" onload="this.media='all'"` para que
      la hoja no bloquease el pintado, pero eso es JavaScript en linea y obliga
      a abrir la CSP con 'unsafe-inline' en script-src, que es justo lo que
      frena un XSS. Se prefiere la hoja normal: con preconnect el coste es
      pequeno y la CSP puede quedarse estricta.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
    />

    <!--
      Datos estructurados: permiten que Google muestre teléfono, horario y
      ubicación directamente en los resultados de búsqueda.
      TODO: mantener sincronizado con src/config/contacto.ts
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "RTS Technology Solutions",
        "description": "Soluciones tecnológicas integrales para empresas en República Dominicana: redes, ciberseguridad, CCTV, cableado estructurado, soporte técnico N2, automatización de procesos y desarrollo web.",
        "url": "https://rts-technology.pages.dev/",
        "email": "rtstechnologyrd@gmail.com",
        "telephone": "+1-809-000-0000",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Santo Domingo",
          "addressRegion": "Distrito Nacional",
          "addressCountry": "DO"
        },
        "areaServed": { "@type": "Country", "name": "República Dominicana" },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "08:00",
            "closes": "18:00"
          }
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Servicios tecnológicos empresariales",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Instalación de cámaras de seguridad y CCTV" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Soporte técnico empresarial" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Instalación de redes y WiFi empresarial" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Cableado estructurado categoría 6/6A" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Venta y mantenimiento de computadoras y servidores" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Ciberseguridad y respaldo de datos" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Automatización de procesos" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Diseño y desarrollo web" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Asesoría tecnológica" } }
          ]
        }
      }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
